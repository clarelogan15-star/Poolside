<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e2effc">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Book a Swim Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;700&display=swap">
<style>
/* Layout: one narrow column for phones; a day list of time buttons, then a short form. */
:root {
  --bg: #fdf2f6; --surface: #ffffff; --sunk: #fbe4ec; --ink: #1d2a44; --muted: #5d6882; --line: #f1d3de;
  --head: #e2effc; --sky: #a9d2f5; --pink: #f6b3c8; --pink-soft: #fde4ec;
  --accent: #2f6db0; --accent-ink: #ffffff; --accent-soft: #dcebfb; --warn: #b8324c; --good: #23845a; --good-soft: #d9f0e4;
  --display: "Familjen Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1b1720; --surface: #25202b; --sunk: #2c2532; --ink: #f1eaf2; --muted: #b3a8b8; --line: #3d3443;
  --head: #1d2a3b; --sky: #7fb6e6; --pink: #e993b0; --pink-soft: #3a2531;
  --accent: #8cc4f5; --accent-ink: #0b1d33; --accent-soft: #1e3450; --warn: #f28aa0; --good: #5cc98b; --good-soft: #15372a; color-scheme: dark } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: var(--head); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 22px 18px; display: grid; gap: 4px; }
header h1 { font-size: 28px; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
.rope { height: 6px; background: repeating-linear-gradient(90deg, var(--pink) 0 14px, #ffffff 14px 18px, var(--sky) 18px 32px, #ffffff 32px 36px); }
main { padding-block: 20px 60px; display: grid; gap: 14px; }
.intro { margin: 0; color: var(--muted); }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; display: grid; gap: 10px; }
.day h2 { font-size: 17px; }
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.time { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 10px; padding: 10px 6px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.time:hover { background: var(--accent-soft); }
.time[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.about { gap: 8px; border-top: 4px solid var(--pink); }
.prices { gap: 10px; background: var(--pink-soft); border-color: var(--pink); } .prices p { margin: 0; }
.pay { display: grid; gap: 8px; } .pay h3 { font-size: 16px; } .pay p { font-size: 14px; }
.payopt { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); text-decoration: none; }
.payopt span { font-variant-numeric: tabular-nums; user-select: all; }
a.payopt span { color: var(--accent); font-weight: 700; }
.ptable { overflow-x: auto; background: var(--surface); border-radius: 10px; border: 1px solid var(--line); }
.ptable table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ptable th, .ptable td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.ptable td { white-space: nowrap; }
.ptable tbody tr:last-child > * { border-bottom: 0; }
.ptable thead th { background: var(--accent-soft); font-size: 14px; }
.ptable tbody th { text-align: left; font-weight: 700; } .about .me { width: 100%; height: auto; border-radius: 10px; display: block; }
.abouttext { display: grid; gap: 8px; align-content: start; }
@media (min-width: 640px) { .about { grid-template-columns: 220px 1fr; gap: 20px; align-items: start; } } .about p { margin: 0; }
.picked { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-weight: 700; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
input, textarea { font-weight: 400; color: var(--ink); padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; font-size: 16px; }
.two { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 12px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .6; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.warn { color: var(--warn); font-weight: 700; margin: 0; }
.muted { color: var(--muted); }
.done { text-align: center; padding: 28px 18px; }
.done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; font-size: 28px; margin: 0 auto 12px; font-weight: 700; }
.demo { background: #fbefd2; color: #5a4300; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
</head>
<body>
<header><div class="wrap"><h1 id="biz">Swim lessons</h1><p id="who">Book a lesson time</p></div><div class="rope"></div></header>
<main class="wrap" id="app"><p class="muted">Loading open times…</p></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const fmtTime = (t) => { let [h, m] = String(t).split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const longDay = (s) => parseD(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

const CFG = window.POOLSIDE_CONFIG || {};
const configured = /^https:\/\//.test(CFG.supabaseUrl || "") && String(CFG.supabaseAnonKey || "").length > 20;
const sb = configured && window.supabase ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: false } }) : null;
const state = { coach: "", business: "", about: "", prices: "", venmo: false, zelle: false, slots: [], picked: null, sent: null, error: "", busy: false, form: {} };

function demoSlots() {
  const out = [], now = new Date();
  for (let i = 1; i <= 10; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    for (const t of ["09:30", "11:30", "15:30", "17:00"]) out.push({ id: `demo-${i}-${t}`, date: ymd(d), time: t, length: 30 });
  }
  return out;
}
async function load() {
  if (!sb) { Object.assign(state, { coach: "Clare", business: "", venmo: true, zelle: true, prices: "Private swim lessons\nDuration\t1 Child\t2 Children\t3 Children\n30 min\t$60\t$80\t$85\n45 min\t$85\t$115\t$115\n1 hour\t$105\t$150\t$150", about: "Hi! I swim at Duke and have taught summer swim lessons since 2023. Lessons are one-on-one and start with feeling safe and confident in the water.", slots: demoSlots() }); return; }
  const { data, error } = await sb.rpc("get_booking_page");
  if (error) throw error;
  const today = ymd(new Date());
  Object.assign(state, { coach: data.coach || "", business: data.business || "", about: data.about || "", prices: data.prices || "", venmo: data.venmo === true, zelle: data.zelle === true, slots: (data.slots || []).filter((x) => x.date >= today) });
}

// Prices: lines pasted from a spreadsheet (cells split by tabs, or by " | ") become a table; other lines stay text.
function priceBlocks(text) {
  const out = []; let rows = [];
  const flush = () => {
    if (!rows.length) return;
    const n = Math.max(...rows.map((r) => r.length));
    const cell = (tag, c) => `<${tag}>${esc(c)}</${tag}>`;
    const [head, ...body] = rows;
    out.push(`<div class="ptable"><table><thead><tr>${Array.from({ length: n }, (_, i) => cell("th", head[i] || "")).join("")}</tr></thead><tbody>${body.map((r) =>
      `<tr>${Array.from({ length: n }, (_, i) => cell(i ? "td" : "th", r[i] || "")).join("")}</tr>`).join("")}</tbody></table></div>`);
    rows = [];
  };
  for (const raw of String(text).split("\n")) {
    const cells = raw.split(/\t| \| /).map((c) => c.trim());
    while (cells.length && !cells[cells.length - 1]) cells.pop();
    if (cells.length > 1) { rows.push(cells); continue; }
    flush();
    if (cells[0]) out.push(`<p>${esc(cells[0])}</p>`);
  }
  flush();
  return out.join("");
}

function render() {
  $("#biz").textContent = state.business || (state.coach ? `Swim lessons with ${state.coach}` : "Swim lessons");
  $("#who").textContent = state.business && state.coach ? `with ${state.coach} · Book a lesson time` : "Book a lesson time";
  document.title = `Book a lesson · ${state.business || state.coach || "Swim lessons"}`;
  const coach = state.coach || "your coach";
  const demo = sb ? "" : '<div class="demo">Demo: these are example times and requests are not sent anywhere.</div>';
  if (state.sent) {
    $("#app").innerHTML = `${demo}<div class="card done"><div class="tick">✓</div><h2>Request sent</h2>
      <p>${esc(state.sent.child)} · ${esc(longDay(state.sent.date))} at ${esc(fmtTime(state.sent.time))}</p>
      <p class="muted">${esc(state.coach || "Your coach")} will text you at ${esc(state.sent.phone)} to confirm. The lesson isn't booked until then.</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="again">Request another time</button></div></div>`;
    return;
  }
  const days = [...new Set(state.slots.map((x) => x.date))].sort();
  const p = state.slots.find((x) => x.id === state.picked);
  const f = state.form;
  const about = state.about ? `<section class="card about"><img class="me" src="photo.jpg" alt="${esc(state.coach || "Your coach")} at the U.S. Olympic Team Trials" width="596" height="799" onerror="this.remove()"><div class="abouttext"><h2>About ${esc(state.coach || "me")}</h2>${state.about.split(/\n\s*\n/).map((para) => `<p>${esc(para.trim()).replace(/\n/g, "<br>")}</p>`).join("")}</div></section>` : "";
  const paras = (t) => t.split(/\n\s*\n/).map((para) => `<p>${esc(para.trim()).replace(/\n/g, "<br>")}</p>`).join("");
  const ways = [state.venmo && "Venmo", state.zelle && "Zelle"].filter(Boolean).join(" or ");
  const pay = ways ? `<div class="pay"><h3>How to pay</h3><p class="muted">Pay by ${ways} after ${esc(state.coach || "your coach")} confirms your lesson. Payment details come with the confirmation text.</p></div>` : "";
  const prices = state.prices || pay ? `<section class="card prices">${state.prices ? `<h2>Prices</h2>${priceBlocks(state.prices)}` : ""}${pay}</section>` : "";
  $("#app").innerHTML = `${demo}${about}${prices}
    <p class="intro">Choose a time. ${esc(state.coach || "Your coach")} will text you to confirm.</p>
    ${state.error && !p ? `<p class="warn">${esc(state.error)}</p>` : ""}
    ${days.length ? days.map((d) => `<section class="day"><h2>${esc(longDay(d))}</h2><div class="times">${state.slots.filter((x) => x.date === d).sort((a, b) => a.time.localeCompare(b.time)).map((x) =>
      `<button class="time" data-act="pick" data-id="${esc(x.id)}" aria-pressed="${x.id === state.picked}">${esc(fmtTime(x.time))}</button>`).join("")}</div></section>`).join("")
      : `<div class="card"><h2>No open times right now</h2><p class="muted" style="margin:0">Check back soon, or text ${esc(coach)} directly.</p></div>`}
    ${p ? `<form class="card" id="req" autocomplete="on">
      <div class="picked">${esc(longDay(p.date))} at ${esc(fmtTime(p.time))} · ${p.length} minutes</div>
      <label>Your name<input id="f-parent" name="parent" autocomplete="name" required maxlength="100" value="${esc(f.parent || "")}"></label>
      <label>Mobile number (for the confirmation text)<input id="f-phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" value="${esc(f.phone || "")}"></label>
      <label>Email (optional)<input id="f-email" name="email" type="email" autocomplete="email" maxlength="200" value="${esc(f.email || "")}"></label>
      <div class="two"><label>Swimmer's name<input id="f-child" name="child" required maxlength="100" value="${esc(f.child || "")}"></label>
      <label>Age<input id="f-age" name="age" inputmode="numeric" maxlength="20" value="${esc(f.age || "")}"></label></div>
      <label>Lesson location<input id="f-location" name="location" required maxlength="200" autocomplete="street-address" placeholder="Pool name or address" value="${esc(f.location || "")}"></label>
      <label>Anything ${esc(coach)} should know? (optional)<textarea id="f-note" name="note" rows="3" maxlength="1000" placeholder="Swimming experience, worries, or questions">${esc(f.note || "")}</textarea></label>
      ${state.error ? `<p class="warn">${esc(state.error)}</p>` : ""}
      <button class="btn primary" ${state.busy ? "disabled" : ""}>${state.busy ? "Sending…" : "Request this time"}</button>
    </form>` : ""}`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "pick") {
    state.picked = el.dataset.id; state.error = ""; render();
    const form = $("#req"); if (form) { form.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
  if (el.dataset.act === "again") { state.sent = null; state.picked = null; reload(); }
});
document.addEventListener("input", (e) => { if (e.target.closest("#req") && e.target.name) state.form[e.target.name] = e.target.value; });
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "req") return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target)); state.form = v;
  const p = state.slots.find((x) => x.id === state.picked);
  if (String(v.phone).replace(/\D/g, "").length < 7) { state.error = "Please enter a full phone number so you can get the confirmation text."; render(); return; }
  state.busy = true; state.error = ""; render();
  try {
    if (sb) {
      const args = { p_slot: p.id, p_parent: v.parent, p_phone: v.phone, p_email: v.email || "", p_child: v.child, p_age: v.age || "", p_note: v.note || "" };
      let { error } = await sb.rpc("request_booking", { ...args, p_location: v.location || "" });
      // If the database hasn't been updated for locations yet, send the location inside the note instead.
      if (error && error.code === "PGRST202") ({ error } = await sb.rpc("request_booking", { ...args, p_note: [`Location: ${v.location || ""}`, v.note || ""].filter(Boolean).join("\n") }));
      if (error) throw error;
    }
    state.sent = { child: v.child, date: p.date, time: p.time, phone: v.phone };
    state.form = { parent: v.parent, phone: v.phone, email: v.email, location: v.location };
  } catch (err) {
    const code = err && err.message;
    state.error = code === "taken" ? "Sorry, someone just took that time. Please pick another one."
      : code === "too_many" ? "You already have several requests waiting. Please wait for a reply first."
      : code === "missing_fields" ? "Please fill in your name, phone number, the swimmer's name and the lesson location."
      : "That didn't go through. Check your connection and try again.";
    if (code === "taken") { state.picked = null; await reload(true); }
  }
  state.busy = false; render();
});
async function reload(keepError) {
  try { await load(); } catch (err) { if (!keepError) state.error = "Couldn't load open times. Check your connection and refresh the page."; }
  render();
}
reload();
</script>
</body>
</html>
