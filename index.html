<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poolside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one working surface under a lane-rope header; tabs for Schedule, Families, Progress, Updates. */
:root {
  --bg: #edf4f4; --surface: #ffffff; --sunk: #e3eeef; --ink: #0f2b33; --muted: #52707a; --line: #cfe0e2;
  --accent: #0a7285; --accent-ink: #ffffff; --accent-soft: #d6eef1;
  --rope: #dd4f37; --sun: #e3a316; --sun-soft: #fbefd2; --good: #23845a; --good-soft: #d9f0e4;
  --l1: #c4eef3; --l1-ink: #0f3a42; --l2: #8bd7e1; --l2-ink: #0f3a42; --l3: #3fb2c4; --l3-ink: #06272d;
  --l4: #1c7d95; --l4-ink: #ffffff; --l5: #17476a; --l5-ink: #ffffff;
  --display: "Familjen Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1a1f; --surface: #11252c; --sunk: #0e2027; --ink: #e2eff1; --muted: #8eabb2; --line: #23424b;
  --accent: #43c3d5; --accent-ink: #032329; --accent-soft: #143a43;
  --rope: #f07a62; --sun: #f2c14e; --sun-soft: #3a3016; --good: #5cc98b; --good-soft: #15372a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1a1f; --surface: #11252c; --sunk: #0e2027; --ink: #e2eff1; --muted: #8eabb2; --line: #23424b;
  --accent: #43c3d5; --accent-ink: #032329; --accent-soft: #143a43;
  --rope: #f07a62; --sun: #f2c14e; --sun-soft: #3a3016; --good: #5cc98b; --good-soft: #15372a; color-scheme: dark }

* { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 24px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }
.rope { height: 6px; background: repeating-linear-gradient(90deg, var(--rope) 0 14px, #ffffff 14px 18px, var(--accent) 18px 32px, #ffffff 32px 36px); opacity: .9; }

main { padding-block: 22px 60px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.bar h2 { font-size: 22px; margin-right: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { color: var(--rope); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--sun-soft); border: 1px solid color-mix(in srgb, var(--sun) 45%, transparent); padding: 10px 14px; border-radius: var(--r); margin-bottom: 16px; font-size: 14px; }
.notice span { flex: 1 1 280px; }
.ex { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; }
.muted { color: var(--muted); }
.lvl { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.lvl.l1 { background: var(--l1); color: var(--l1-ink); } .lvl.l2 { background: var(--l2); color: var(--l2-ink); }
.lvl.l3 { background: var(--l3); color: var(--l3-ink); } .lvl.l4 { background: var(--l4); color: var(--l4-ink); }
.lvl.l5 { background: var(--l5); color: var(--l5-ink); }

/* Schedule */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-height: 150px; display: flex; flex-direction: column; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day h3 { font-size: 14px; padding: 10px 10px 6px; display: flex; justify-content: space-between; gap: 6px; }
.day h3 small { font-family: var(--body); font-weight: 400; color: var(--muted); }
.slots { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 10px; }
.lesson { text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 6px 8px; cursor: pointer; display: grid; gap: 1px; border-left: 4px solid var(--accent); min-width: 0; }
.lesson:hover { border-color: var(--accent); }
.lesson b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson.done { border-left-color: var(--good); }
.lesson.cancelled { border-left-color: var(--muted); opacity: .6; }
.lesson.cancelled b { text-decoration: line-through; }
.lesson.clash { border-left-color: var(--rope); }
.addday { margin-top: auto; border: 1px dashed var(--line); background: none; border-radius: 8px; color: var(--muted); font-size: 13px; padding: 4px; cursor: pointer; margin: auto 8px 8px; }
.addday:hover { color: var(--accent); border-color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--display); font-size: 18px; margin-right: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) { .week { grid-template-columns: 1fr; } .day { min-height: 0; } .addday { margin-top: 4px; } }

/* Families */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-size: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.contact { display: grid; gap: 2px; font-size: 14px; }
.contact .sel { user-select: all; font-variant-numeric: tabular-nums; }
.kid { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; background: var(--sunk); border-radius: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100%; }
.kid:hover { border-color: var(--accent); }
.meter { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.search { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; width: 220px; max-width: 100%; }

/* Two-pane (progress, updates) */
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow: auto; }
.list .search { width: 100%; margin-bottom: 6px; }
.pick { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.pick:hover { background: var(--sunk); }
.pick[aria-current="true"] { background: var(--accent-soft); }
.pick small { color: var(--muted); display: block; font-size: 12px; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pane h2 { font-size: 26px; }
.levelblock { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.levelblock > header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; background: var(--sunk); cursor: pointer; }
.levelblock > header h3 { font-size: 15px; margin-right: auto; }
.skills { display: grid; }
.skill { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.skill:hover { background: var(--sunk); }
.skill .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.skill.working .dot { border-color: var(--sun); background: var(--sun-soft); color: var(--sun); }
.skill.got .dot { border-color: var(--good); background: var(--good); color: var(--surface); }
.skill .st { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
label.f input, label.f select, label.f textarea, textarea.big { font-weight: 400; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
textarea.big { min-height: 190px; line-height: 1.55; resize: vertical; font-size: 15px; }
.history { display: grid; gap: 6px; font-size: 14px; }
.history div { display: flex; gap: 10px; flex-wrap: wrap; }
.history time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
.pill { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.sun { background: var(--sun-soft); color: var(--sun); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; font-size: 18px; }
.sparkle { font-weight: 700; }
.draftcard { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.draftcard p { margin: 0; white-space: pre-wrap; }

/* Modal */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal h2 { font-size: 21px; }
.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .modal .two { grid-template-columns: 1fr; } }
.modal .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.modal .acts .left { margin-right: auto; }
.warn { color: var(--rope); font-size: 14px; font-weight: 700; }
.textcard { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.textcard header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.textcard pre { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 14px; background: var(--sunk); padding: 10px; border-radius: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .modal { animation: rise .16s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: .6; } } }
/* Lesson plans + video feedback */
.dayhead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 10px 10px 2px; }
textarea.plan { min-height: 230px; font-variant-numeric: tabular-nums; }
.notice.honest { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.filebtn { position: relative; display: inline-flex; align-items: center; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.frames figure { margin: 0; display: grid; gap: 2px; min-width: 0; }
.frames img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; display: block; background: var(--sunk); }
.frames figcaption { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb { display: grid; gap: 12px; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.fb p { margin: 0; }
.fb h4 { margin: 0 0 4px; font-family: var(--display); font-size: 14px; }
.fb ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sugg { display: grid; gap: 8px; }
.sg { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--sunk); border-radius: 8px; }
.sg > span:first-child { flex: 1 1 220px; min-width: 0; }
.past { border-top: 1px solid var(--line); padding: 8px 0; }
.past summary { cursor: pointer; font-size: 14px; }
.past .fb { margin-top: 8px; }
/* Standalone app: sign-in, booking */
.login { max-width: 420px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
.login h2 { font-size: 24px; }
.login p { margin: 0; }
.loginform { display: grid; gap: 12px; }
.topacts { display: flex; gap: 6px; align-items: center; }
.sharebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; margin-bottom: 20px; }
.sharebox code { font-size: 14px; background: var(--sunk); padding: 6px 10px; border-radius: 6px; overflow-wrap: anywhere; user-select: all; }
.section-h { font-size: 18px; margin: 22px 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.section-h small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 14px; }
.reqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.req .when { font-family: var(--display); font-weight: 600; font-size: 16px; }
.slotdays { display: grid; gap: 10px; }
.slotday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px 12px; }
.slotday .dayhead { padding-left: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 4px 3px 12px; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--sunk); }
.chip.held { background: var(--sun-soft); border-color: color-mix(in srgb, var(--sun) 45%, transparent); padding-right: 12px; }
.chip.booked { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, transparent); padding-right: 12px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; width: 24px; height: 24px; border-radius: 50%; }
.chip button:hover { background: var(--line); color: var(--ink); }
.chip small { color: var(--muted); }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
</style>

<script src="config.js"></script>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Poolside</h1><span id="sub">Swim lesson manager</span><button class="btn ghost small" id="settings-btn" data-act="settings" hidden>Settings</button></div>
    <nav class="tabs" id="tabs">
      <button data-tab="schedule">Schedule</button>
      <button data-tab="booking" id="tab-booking">Booking</button>
      <button data-tab="families">Families</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="plans">Lesson plans</button>
      <button data-tab="video">Video feedback</button>
      <button data-tab="updates">Parent updates</button>
    </nav>
  </div>
  <div class="rope"></div>
</header>
<main class="wrap" id="app"><div class="empty"><h3>Loading…</h3></div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- skill levels ---------- */
const LEVELS = [
  { n: 1, name: "Water Comfort", skills: ["Enters and exits the pool safely", "Blows bubbles", "Puts whole face in the water", "Floats on front with support"] },
  { n: 2, name: "Floating & Gliding", skills: ["Floats on back alone for 10 seconds", "Front glide for 2 body lengths", "Flutter kick with a kickboard", "Rolls from front to back"] },
  { n: 3, name: "First Strokes", skills: ["Front crawl arms for 5 meters", "Side breathing with support", "Back kick for 10 meters", "Treads water for 30 seconds"] },
  { n: 4, name: "Stroke Builder", skills: ["Front crawl 15 meters with side breathing", "Backstroke 15 meters", "Breaststroke kick", "Dives in from sitting"] },
  { n: 5, name: "Confident Swimmer", skills: ["Front crawl 25 meters", "Backstroke 25 meters", "Breaststroke 15 meters", "Treads water for 2 minutes"] },
];
const skillKey = (n, i) => `l${n}s${i}`;
const STATUS = { no: "Not yet", working: "Working on it", got: "Got it" };
const NEXT = { no: "working", working: "got", got: "no" };

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const fmtTime = (t) => { let [h, m] = String(t || "0:0").split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtDay = (s, o = { weekday: "short", month: "short", day: "numeric" }) => parseD(s).toLocaleDateString(undefined, o);
const today = () => ymd(new Date());
const first = (s) => String(s || "").trim().split(/\s+/)[0] || "";
const byTime = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);

/* ---------- state ---------- */
const state = {
  tab: "schedule", families: [], swimmers: [], lessons: [], updates: [], settings: { coach: "", business: "", about: "" },
  week: mondayOf(new Date()), weekChosen: false, sel: null, q: "", draft: null, mode: "loading",
  tone: "warm", extra: "", busy: false, batch: null, confirm: null, notesBuf: {},
  plans: [], feedback: [], slots: [], requests: [], signup: false, loginError: "", planSel: null, planDraft: null, planFocus: "", planBusy: false, planBatch: null, vid: null, vfocus: "",
};
let db = null, sample = null, sampleTried = false;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into your text app."); }
  catch (e) { toast("Couldn't copy automatically. Select the text and copy it."); }
}

async function remote(q) { const { error } = await q; if (error) throw error; }
function applyLocal(col, id, data) { state[col] = state[col].filter((x) => x.id !== id); if (data) state[col].push({ id, ...data }); }
const store = {
  async add(col, data) { const id = newId(); await this.set(col, id, { ...data, createdAt: Date.now() }); return id; },
  async set(col, id, data) {
    if (sb) await remote(sb.from("records").upsert({ collection: col, id, data, updated_at: new Date().toISOString() }));
    applyLocal(col, id, data); render();
  },
  async setMany(col, items) {
    if (!items.length) return;
    if (sb) await remote(sb.from("records").upsert(items.map(({ id, ...data }) => ({ collection: col, id, data, updated_at: new Date().toISOString() }))));
    for (const { id, ...data } of items) applyLocal(col, id, data);
    render();
  },
  async update(col, id, patch) {
    const cur = state[col].find((x) => x.id === id); if (!cur) return;
    const { id: _ignore, ...rest } = cur;
    await this.set(col, id, { ...rest, ...patch });
  },
  async del(col, id) {
    if (sb) await remote(sb.from("records").delete().eq("collection", col).eq("id", id));
    applyLocal(col, id, null); render();
  },
};
const book = {
  async addSlots(rows) {
    if (!rows.length) return;
    if (sb) await remote(sb.from("slots").insert(rows));
    state.slots.push(...rows); render();
  },
  async updateSlot(id, patch) {
    if (sb) await remote(sb.from("slots").update(patch).eq("id", id));
    const x = state.slots.find((y) => y.id === id); if (x) Object.assign(x, patch); render();
  },
  async delSlot(id) {
    if (sb) await remote(sb.from("slots").delete().eq("id", id));
    state.slots = state.slots.filter((y) => y.id !== id); render();
  },
  async updateRequest(id, patch) {
    if (sb) await remote(sb.from("booking_requests").update(patch).eq("id", id));
    const x = state.requests.find((y) => y.id === id); if (x) Object.assign(x, patch); render();
  },
};
async function saveSettings(patch) {
  const data = { ...state.settings, ...patch };
  if (sb) await remote(sb.from("records").upsert({ collection: "settings", id: "main", data, updated_at: new Date().toISOString() }));
  state.settings = data; render();
}
async function selectAll(table, cols) {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select(cols).range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) return rows;
  }
}
async function loadAll() {
  const [recs, slots, reqs] = await Promise.all([selectAll("records", "collection,id,data"), selectAll("slots", "*"), selectAll("booking_requests", "*")]);
  const by = Object.fromEntries(COLS.map((c) => [c, []]));
  for (const r of recs) {
    if (r.collection === "settings") { if (r.id === "main") state.settings = { ...state.settings, ...r.data }; }
    else if (by[r.collection]) by[r.collection].push({ id: r.id, ...r.data });
  }
  Object.assign(state, by); state.slots = slots; state.requests = reqs;
}
async function refreshBooking() {
  if (!sb || state.mode !== "cloud") return;
  try {
    const [slots, reqs] = await Promise.all([selectAll("slots", "*"), selectAll("booking_requests", "*")]);
    const before = JSON.stringify([state.slots, state.requests].map((a) => a.map((x) => x.id + x.status).sort()));
    const after = JSON.stringify([slots, reqs].map((a) => a.map((x) => x.id + x.status).sort()));
    if (before === after) return;
    state.slots = slots; state.requests = reqs;

/* ---------- AI: calls the Supabase "claude" function, which holds the Anthropic key ---------- */
const blobToB64 = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function parseLooseJson(t) {
  try { return JSON.parse(t); } catch (e) {}
  const m = /```(?:json)?\s*([\s\S]*?)```/.exec(t); if (m) { try { return JSON.parse(m[1]); } catch (e) {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: "invalid_json", text: t };
}
function makeSample() {
  async function call(prompt, opts, wantJson) {
    if (opts.signal && opts.signal.aborted) throw { code: "cancelled" };
    const images = opts.images ? await Promise.all([...opts.images].map(blobToB64)) : [];
    const { data, error } = await sb.functions.invoke("claude", { body: { prompt, images, json: !!wantJson } });
    if (opts.signal && opts.signal.aborted) throw { code: "cancelled" };
    if (error) {
      let code = "offline";
      try { const b = await error.context.json(); if (b && b.error) code = b.error; } catch (e) {}
      throw { code, message: String(error.message || code) };
    }
    if (!data || typeof data.text !== "string") throw { code: "busy" };
    return data.text;
  }
  const fn = async (prompt, opts = {}) => { const text = await call(prompt, opts, false); if (opts.onText) opts.onText({ text, delta: text }); return { text, truncated: false }; };
  fn.json = async (prompt, opts = {}) => parseLooseJson(await call(prompt, opts, true));
  fn.limits = async () => ({ maxPromptBytes: 100000, images: { maxCount: 8, maxInputBytes: 20000000, mediaTypes: ["image/jpeg"] } });
  return fn;
}

function skillLists(s) {
  const sk = skillsOf(s), cur = s.level || 1, working = [], notYet = [], got = [];

    if (st === "working") working.push(name); else if (L.n === cur && st === "no") notYet.push(name); else if (L.n === cur && st === "got") got.push(name);
  }));
  return { working, notYet, got, cur };
}
function planPrompt(l, s, focus) {

  const fb = latestFeedback(s.id);
  return `You are helping a swim instructor plan one private swim lesson. Write a plan they can glance at on their phone at the pool.
Format: plain text only, no markdown symbols (no #, *, or **). First line: "Goal: " and one sentence. Then 4 or 5 time blocks, one per line, written like: 0-5 min | Warm-up: activity. Cue: "short cue". The blocks must cover exactly 0 to ${len} minutes with no gaps. The last block is a fun game that suits a ${s.age ? s.age + "-year-old" : "child"}. Final line: "Check today: " and the one skill to test for sign-off. Under 160 words. Keep it safe and right for the child's age and level. Use only the facts below and don't invent past events.

Swimmer: ${s.name}${s.age ? `, age ${s.age}` : ""}
Lesson: ${fmtDay(l.date)} at ${fmtTime(l.time)}, ${len} minutes
Level ${cur} (${LEVELS[cur - 1].name})
Already has at this level: ${got.join("; ") || "none yet"}
Working on: ${working.join("; ") || "none marked"}
Not started at this level: ${notYet.join("; ") || "none, ready to move up"}
${cur < 5 ? `Next level's skills: ${LEVELS[cur].skills.join("; ")}` : "Top level reached"}
Recent lesson notes: ${notes.join(" | ") || "none"}
Coach notes: ${s.notes || "none"}
Latest video feedback: ${fb ? `${fb.summary} Work on: ${(fb.workOn || []).map((w) => w.point).join("; ") || "nothing listed"}` : "none"}
Instructor's focus for this lesson: ${focus || "none given"}`;

function templatePlan(l, s) {

  const focus = working[0] || notYet[0] || LEVELS[Math.min(cur, 4)].skills[0];
  const a = Math.round(len * 0.17), b = Math.round(len * 0.5), c = len - Math.round(len * 0.17);
  return `Goal: make progress on "${focus}".\n0-${a} min | Warm-up: kicking and bubbles along the wall.\n${a}-${b} min | Main skill: ${focus}. Short tries with lots of praise.\n${b}-${c} min | Practice: ${working[1] || notYet[1] || "review a skill they already have"}.\n${c}-${len} min | Fun finish: a game of their choice.\nCheck today: ${focus}`;

async function draftPlan(l, s, focus, onText, signal) {

async function runPlanBatch() {

const seekTo = (v, t) => new Promise((res) => { const h = () => { v.removeEventListener("seeked", h); res(); }; v.addEventListener("seeked", h); v.currentTime = t; setTimeout(res, 4000); });
const toJpeg = (canvas) => new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error("Couldn't save a frame."))), "image/jpeg", 0.82));

      const blob = await toJpeg(canvas);

}

function exampleBooking(now, lessons) {
  const taken = new Set(lessons.map((l) => l.date + l.time)), slots = [];
  for (let i = 1; i <= 12; i++) {
    const d = addDays(now, i); if (d.getDay() === 0 || d.getDay() === 6) continue;
    for (const time of ["09:30", "11:30", "15:30", "17:00"]) if (!taken.has(ymd(d) + time)) slots.push({ id: newId(), date: ymd(d), time, length: 30, status: "open", example: true });
  }
  const asks = [
    { i: 1, parent_name: "Jenna Park (example)", phone: "555-0110", email: "jenna@example.com", child_name: "Lily Park", child_age: "6", note: "Lily is a little nervous about deep water." },
    { i: 6, parent_name: "Dan Okafor (example)", phone: "555-0102", email: "", child_name: "Sam Okafor", child_age: "6", note: "Could Sam add a lesson this week?" },
  ];
  const requests = asks.filter((a) => slots[a.i]).map(({ i, ...a }) => {
    const sl = slots[i]; sl.status = "held";
    return { id: newId(), slot_id: sl.id, slot_date: sl.date, slot_time: sl.time, slot_length: sl.length, status: "pending", lesson_id: null, example: true, created_at: new Date(now.getTime() - (i + 1) * 3600000).toISOString(), ...a };
  });
  return { slots, requests };
}
async function clearExampleBooking() {

async function writeExampleBooking(now, lessons) {

async function runBatch() {

  if (!list.length) { toast("Everyone who swam this week already has a draft waiting."); return; }
  const ctl = new AbortController(); state.batch = { done: 0, total: list.length, ctl }; render();

    try {
      const r = await draftFor(s, "text", "", null, ctl.signal);
      if (r.failed) failed++;
      await store.add("updates", { swimmerId: s.id, text: r.text, status: "draft" });
      if (r.failed === "rate_limited" || r.failed === "not_granted") break;
    } catch (e) { break; }
    state.batch.done++; render();
  }
  const done = state.batch.done; state.batch = null; state.showDrafts = true; render();
  toast(failed ? `Drafted ${done}. ${failed} used a simple template because the AI wasn't available.` : `Drafted ${done} update${done === 1 ? "" : "s"}. Review them below.`);
}

/* ---------- start ---------- */
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = $("#login-email").value.trim(), password = $("#login-pass").value;
  $("#login-go").disabled = true; state.loginError = "";
  try {
    const res = state.signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if (res.error) { state.loginError = res.error.message || "That didn't work. Check your email and password."; render(); return; }
    if (!res.data.session) { state.signup = false; state.loginError = "Check your email for a confirmation link, then come back here and sign in."; render(); return; }
    await startCloud();
  } catch (err) { state.loginError = "Couldn't reach the server. Check your internet connection."; render(); }
});
function pickWeek() {
  if (state.weekChosen) return; const days = [...Array(7)].map((_, i) => ymd(addDays(state.week, i)));
  if (!state.lessons.some((l) => l.date >= days[0] && l.date <= days[6])) { const nx = state.lessons.filter((l) => l.date >= days[0]).sort(byTime)[0]; if (nx) state.week = mondayOf(parseD(nx.date)); }
}
async function startCloud() {
  state.mode = "loading"; render();
  try {
    const { data: u } = await sb.auth.getUser(); state.email = u && u.user ? u.user.email : "";
    const { data: ok, error } = await sb.rpc("is_coach");
    if (error) throw error;
    if (ok !== true) { state.mode = "notcoach"; render(); return; }
    await loadAll(); pickWeek();
    state.mode = "cloud"; render();
    if (!state.settings.coach) settingsModal();
    setInterval(refreshBooking, 60000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshBooking(); });
  } catch (err) { console.error(err); state.mode = "error"; state.loadError = "Check your internet connection, then try again."; render(); }
}
try { const t = sessionStorage.getItem("swim-tab"); if (t) state.tab = t; } catch (e) {}
render();
(async () => {
  if (!configured || !window.supabase) {
    state.mode = "local";
    const now = new Date(), ex = exampleData(now);
    Object.assign(state, ex, exampleBooking(now, ex.lessons));
    state.settings = { ...state.settings, coach: "Clare" };
    pickWeek(); render(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  if (data && data.session) await startCloud(); else { state.mode = "signedout"; render(); }
})();
</script>
